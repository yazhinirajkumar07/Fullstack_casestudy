<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q8 - Registration Form</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6258dc,#8b6df6);
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
}

h1{text-align:center}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:none;
    border-radius:10px;
    background:#6258dc;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Create Account</h1>

<form id="form">

<label>Full Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="text" id="email">

<label>Password</label>
<input type="password" id="password">

<label>Confirm Password</label>
<input type="password" id="confirmPassword">

<button type="submit">
Register
</button>

<div id="message"></div>

</form>

</div>

<script>

const form =
    document.getElementById("form");

form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirm =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const strongPassword =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

        if(
            name === "" ||
            !emailPattern.test(email)
        ){
            message.textContent =
                "Enter valid details.";
            message.style.color = "red";
        }

        else if(
            !strongPassword.test(password)
        ){
            message.textContent =
                "Password needs 8+ characters, uppercase, lowercase and number.";
            message.style.color = "red";
        }

        else if(
            password !== confirm
        ){
            message.textContent =
                "Passwords do not match.";
            message.style.color = "red";
        }

        else{
            message.textContent =
                "Registration successful!";
            message.style.color = "green";
        }
    }
);

</script>

</body>
</html>
