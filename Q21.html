<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Q21 - Theme Toggle</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: #f4f5fb;

    color: #25252d;

    transition: 0.3s;
}

.container {

    width: 90%;
    max-width: 500px;

    padding: 40px;

    text-align: center;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.1);

    transition: 0.3s;
}

button {

    padding: 14px 25px;

    border: none;

    border-radius: 8px;

    background: #6258dc;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

.dark {

    background: #25252d;

    color: white;
}

.dark .container {

    background: #363642;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.4);
}

</style>

</head>

<body>

<div class="container">

    <h1>Theme Toggle</h1>

    <p>

        Click the button to switch
        between light and dark mode.

    </p>

    <button onclick="toggleTheme()">

        Toggle Theme

    </button>

</div>

<script>

function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );

}

</script>

</body>

</html>
