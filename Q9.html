<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q9 - Feedback Form</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f5fb;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    width:100%;
    max-width:550px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.1);
}

h1{text-align:center}

input,textarea{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:inherit;
}

textarea{
    height:150px;
    resize:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#6258dc;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>User Feedback</h1>

<form id="feedbackForm">

<input
    type="text"
    id="name"
    placeholder="Your name"
>

<input
    type="text"
    id="email"
    placeholder="Your email"
>

<textarea
    id="feedback"
    placeholder="Write at least 50 characters..."
></textarea>

<button type="submit">
Submit Feedback
</button>

<div id="message"></div>

</form>

</div>

<script>

document
    .getElementById("feedbackForm")
    .addEventListener(
        "submit",
        function(event){

            event.preventDefault();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const feedback =
                document.getElementById("feedback").value.trim();

            const message =
                document.getElementById("message");

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if(
                name === "" ||
                email === "" ||
                feedback === ""
            ){
                message.textContent =
                    "All fields are required.";
                message.style.color = "red";
            }

            else if(
                !emailPattern.test(email)
            ){
                message.textContent =
                    "Enter a valid email.";
                message.style.color = "red";
            }

            else if(
                feedback.length < 50
            ){
                message.textContent =
                    "Message must contain at least 50 characters.";
                message.style.color = "red";
            }

            else{
                message.textContent =
                    "Feedback submitted successfully!";
                message.style.color = "green";
            }
        }
    );

</script>

</body>
</html>
