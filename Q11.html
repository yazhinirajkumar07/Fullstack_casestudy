<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Q11 - Contact Us Form</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
    background: #f4f5fb;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;

    background: white;
    padding: 35px;

    border-radius: 18px;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.1);
}

h1 {
    text-align: center;
    margin-top: 0;
}

input,
textarea {
    width: 100%;

    padding: 12px;
    margin-top: 10px;

    border: 1px solid #ccc;
    border-radius: 8px;

    font-size: 16px;
}

textarea {
    height: 120px;
    resize: vertical;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    flex: 1;

    padding: 13px;

    border: none;
    border-radius: 8px;

    color: white;

    font-size: 16px;
    cursor: pointer;
}

.submit {
    background: #6258dc;
}

.clear {
    background: #ef4444;
}

#message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

    <h1>Contact Us</h1>

    <form id="contactForm">

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <textarea
            id="messageInput"
            placeholder="Enter your message"
        ></textarea>

        <div class="buttons">

            <button
                type="button"
                class="submit"
                onclick="submitForm()"
            >
                Submit
            </button>

            <button
                type="button"
                class="clear"
                onclick="clearForm()"
            >
                Clear
            </button>

        </div>

    </form>

    <div id="message"></div>

</div>

<script>

function submitForm() {

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const userMessage =
        document
            .getElementById("messageInput")
            .value
            .trim();

    const message =
        document
            .getElementById("message");

    if (
        name === "" ||
        email === "" ||
        userMessage === ""
    ) {

        message.textContent =
            "Please fill all fields.";

        message.style.color =
            "red";

    }

    else {

        message.textContent =
            "Message submitted successfully!";

        message.style.color =
            "green";

    }

}

function clearForm() {

    document
        .getElementById("contactForm")
        .reset();

    document
        .getElementById("message")
        .textContent = "";

}

</script>

</body>

</html>
