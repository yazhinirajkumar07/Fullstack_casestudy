<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Q1 - User Form Validation</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #6258dc,
                    #8b6df6
                );

            padding: 20px;
        }


        .container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 22px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.2);
        }


        .form-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #6258dc,
                    #8b6df6
                );

            color: white;

            font-size: 28px;
        }


        h1 {
            text-align: center;

            font-size: 28px;

            margin-bottom: 10px;

            color: #25252d;
        }


        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;

            font-size: 14px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;

            color: #444;
        }


        input {
            width: 100%;

            padding: 14px;

            border:
                1px solid #dddddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }


        input:focus {
            border-color: #6258dc;

            box-shadow:
                0 0 0 4px
                rgba(98, 88, 220, 0.12);
        }


        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #6258dc,
                    #8b6df6
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 20px
                rgba(98, 88, 220, 0.3);
        }


        #message {
            display: none;

            margin-top: 20px;

            padding: 13px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;
        }


        .error {
            display: block !important;

            background: #ffe8e8;

            color: #c62828;
        }


        .success {
            display: block !important;

            background: #e8f8ee;

            color: #168346;
        }


        @media (
            max-width: 480px
        ) {

            .container {
                padding: 30px 22px;
            }


            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="form-icon">

            ✦

        </div>


        <h1>

            User Information

        </h1>


        <p class="subtitle">

            Please enter your details below

        </p>


        <form id="userForm">


            <div class="form-group">

                <label for="name">

                    Full Name

                </label>


                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

            </div>



            <div class="form-group">

                <label for="email">

                    Email Address

                </label>


                <input
                    type="text"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>



            <button type="submit">

                Submit Form

            </button>


            <div id="message">

            </div>


        </form>


    </div>



    <script>

        const form =
            document.getElementById(
                "userForm"
            );


        const nameInput =
            document.getElementById(
                "name"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const message =
            document.getElementById(
                "message"
            );



        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const name =
                    nameInput.value.trim();


                const email =
                    emailInput.value.trim();



                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;



                message.className = "";



                if (
                    name === ""
                ) {

                    message.textContent =
                        "Please enter your name.";

                    message.classList.add(
                        "error"
                    );

                    nameInput.focus();

                    return;

                }



                if (
                    email === ""
                ) {

                    message.textContent =
                        "Please enter your email address.";

                    message.classList.add(
                        "error"
                    );

                    emailInput.focus();

                    return;

                }



                if (
                    !emailPattern.test(
                        email
                    )
                ) {

                    message.textContent =
                        "Please enter a valid email address.";

                    message.classList.add(
                        "error"
                    );

                    emailInput.focus();

                    return;

                }



                message.textContent =
                    "Form submitted successfully!";

                message.classList.add(
                    "success"
                );


                form.reset();

            }
        );

    </script>


</body>

</html>
