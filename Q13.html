<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Q13 - Student Marks Table</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 50px 8%;

    font-family: Arial, sans-serif;

    background: #f4f5fb;
}

h1 {

    text-align: center;

    margin-bottom: 35px;
}

.table-container {

    overflow-x: auto;

    background: white;

    padding: 20px;

    border-radius: 15px;

    box-shadow:
        0 10px 25px
        rgba(0, 0, 0, 0.1);
}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 600px;
}

th,
td {

    padding: 15px;

    text-align: center;

    border-bottom:
        1px solid #ddd;
}

th {

    background: #6258dc;

    color: white;
}

.highest {

    background: #dff7e5;

    font-weight: bold;
}

</style>

</head>

<body>

<h1>Student Marks</h1>

<div class="table-container">

    <table>

        <thead>

            <tr>

                <th>Name</th>

                <th>Maths</th>

                <th>Science</th>

                <th>English</th>

                <th>Total</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>Arun</td>

                <td>80</td>

                <td>75</td>

                <td>85</td>

                <td>240</td>

            </tr>

            <tr class="highest">

                <td>Priya</td>

                <td>95</td>

                <td>90</td>

                <td>92</td>

                <td>277</td>

            </tr>

            <tr>

                <td>Rahul</td>

                <td>78</td>

                <td>88</td>

                <td>82</td>

                <td>248</td>

            </tr>

            <tr>

                <td>Divya</td>

                <td>85</td>

                <td>80</td>

                <td>89</td>

                <td>254</td>

            </tr>

        </tbody>

    </table>

</div>

</body>

</html>
