<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q5 - To Do List</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#f4f5fb,#e9e7ff);
    padding:20px;
}

.container{
    width:100%;
    max-width:600px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.1);
}

h1{text-align:center}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#6258dc;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

ul{
    list-style:none;
    padding:0;
}

li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f5f5fa;
    padding:14px;
    margin-top:12px;
    border-radius:10px;
}

.task{
    cursor:pointer;
}

.completed{
    text-decoration:line-through;
    opacity:.5;
}

.delete{
    background:#ef4444;
}

@media(max-width:500px){
    .input-area{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>My To-Do List</h1>

<div class="input-area">

    <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task"
    >

    <button onclick="addTask()">
        Add
    </button>

</div>

<ul id="taskList"></ul>

</div>

<script>

function addTask(){

    const input =
        document.getElementById("taskInput");

    const task =
        input.value.trim();

    if(task === ""){
        return;
    }

    const li =
        document.createElement("li");

    li.innerHTML = `
        <span
            class="task"
            onclick="toggleTask(this)"
        >
            ${task}
        </span>

        <button
            class="delete"
            onclick="deleteTask(this)"
        >
            Delete
        </button>
    `;

    document
        .getElementById("taskList")
        .appendChild(li);

    input.value = "";
}

function toggleTask(element){

    element.classList.toggle("completed");
}

function deleteTask(button){

    button
        .parentElement
        .remove();
}

</script>

</body>
</html>
