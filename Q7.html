<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q7 - Photo Gallery</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:40px 8%;
    background:#f4f5fb;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    margin-bottom:35px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.image-box{
    overflow:hidden;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

img{
    width:100%;
    height:250px;
    display:block;
    object-fit:cover;
    transition:.4s;
}

.image-box:hover img{
    transform:scale(1.1);
}

@media(max-width:800px){
    .gallery{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .gallery{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<h1>Responsive Photo Gallery</h1>

<div class="gallery">

    <div class="image-box">
        <img src="https://picsum.photos/seed/a/600/400" alt="Gallery Image">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/seed/b/600/400" alt="Gallery Image">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/seed/c/600/400" alt="Gallery Image">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/seed/d/600/400" alt="Gallery Image">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/seed/e/600/400" alt="Gallery Image">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/seed/f/600/400" alt="Gallery Image">
    </div>

</div>

</body>
</html>
