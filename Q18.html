<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Q18 - DOM Manipulation</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f5fb;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;

            margin-bottom: 25px;

            color: #25252d;
        }

        #paragraph {
            padding: 20px;

            background: #f4f5fb;

            border-radius: 10px;

            line-height: 1.6;

            margin-bottom: 20px;

            transition: 0.3s;
        }

        .input-box {
            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }

        input {
            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        button {
            padding: 12px 18px;

            border: none;

            border-radius: 8px;

            background: #6258dc;

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            opacity: 0.85;
        }

        .controls {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 20px;
        }

        .delete {
            background: #ef4444;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 12px 15px;

            margin-bottom: 10px;

            background: #f4f5fb;

            border-radius: 8px;
        }

        li button {
            padding: 7px 12px;

            background: #ef4444;
        }

        @media (max-width: 500px) {

            .input-box {
                flex-direction: column;
            }

            .input-box button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>DOM Manipulation</h1>

    <p id="paragraph">

        This is a sample paragraph.
        Use the buttons below to change
        its alignment and manage the list.

    </p>


    <div class="controls">

        <button onclick="changeAlignment('left')">

            Left

        </button>

        <button onclick="changeAlignment('center')">

            Center

        </button>

        <button onclick="changeAlignment('right')">

            Right

        </button>

        <button onclick="changeText()">

            Change Text

        </button>

    </div>


    <div class="input-box">

        <input
            type="text"
            id="itemInput"
            placeholder="Enter a new item"
        >

        <button onclick="addItem()">

            Add

        </button>

    </div>


    <ul id="list">

        <li>
            HTML

            <button onclick="removeItem(this)">
                Delete
            </button>
        </li>

        <li>
            CSS

            <button onclick="removeItem(this)">
                Delete
            </button>
        </li>

        <li>
            JavaScript

            <button onclick="removeItem(this)">
                Delete
            </button>
        </li>

    </ul>

</div>


<script>

function changeAlignment(alignment) {

    document
        .getElementById("paragraph")
        .style.textAlign =
        alignment;

}


function changeText() {

    document
        .getElementById("paragraph")
        .textContent =
        "The paragraph text has been changed using JavaScript DOM manipulation.";

}


function addItem() {

    const input =
        document
            .getElementById("itemInput");

    const value =
        input.value.trim();

    if (value === "") {

        alert(
            "Please enter an item."
        );

        return;

    }

    const list =
        document
            .getElementById("list");

    const item =
        document.createElement("li");

    item.textContent =
        value;


    const deleteButton =
        document.createElement("button");

    deleteButton.textContent =
        "Delete";

    deleteButton.onclick =
        function() {

            removeItem(deleteButton);

        };


    item.appendChild(
        deleteButton
    );

    list.appendChild(
        item
    );

    input.value = "";

}


function removeItem(button) {

    button
        .parentElement
        .remove();

}

</script>

</body>

</html>
