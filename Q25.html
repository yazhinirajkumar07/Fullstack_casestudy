<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Q25 - Product Gallery</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family: Arial, sans-serif;

    background: #f4f5fb;

    padding: 50px 8%;
}

h1 {

    text-align: center;

    margin-bottom: 30px;
}

.filters {

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 35px;
}

.filters button {

    padding: 12px 20px;

    border: none;

    border-radius: 8px;

    background: #6258dc;

    color: white;

    cursor: pointer;
}

.gallery {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}

.product {

    background: white;

    padding: 25px;

    border-radius: 15px;

    text-align: center;

    box-shadow:
        0 8px 20px
        rgba(0, 0, 0, 0.08);
}

.product-image {

    font-size: 60px;

    margin-bottom: 15px;
}

.product h3 {

    margin-bottom: 8px;
}

.product p {

    color: #6258dc;

    font-weight: bold;
}

@media (max-width: 768px) {

    .gallery {

        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media (max-width: 500px) {

    .gallery {

        grid-template-columns:
            1fr;
    }

}

</style>

</head>

<body>

<h1>Product Gallery</h1>

<div class="filters">

    <button onclick="filterProducts('all')">

        All

    </button>

    <button onclick="filterProducts('electronics')">

        Electronics

    </button>

    <button onclick="filterProducts('clothing')">

        Clothing

    </button>

    <button onclick="filterProducts('food')">

        Food

    </button>

</div>

<div class="gallery">

    <div
        class="product electronics"
    >

        <div class="product-image">
            📱
        </div>

        <h3>Smartphone</h3>

        <p>₹20,000</p>

    </div>

    <div
        class="product electronics"
    >

        <div class="product-image">
            💻
        </div>

        <h3>Laptop</h3>

        <p>₹50,000</p>

    </div>

    <div
        class="product clothing"
    >

        <div class="product-image">
            👕
        </div>

        <h3>T-Shirt</h3>

        <p>₹799</p>

    </div>

    <div
        class="product clothing"
    >

        <div class="product-image">
            👟
        </div>

        <h3>Shoes</h3>

        <p>₹2,499</p>

    </div>

    <div
        class="product food"
    >

        <div class="product-image">
            🍕
        </div>

        <h3>Pizza</h3>

        <p>₹299</p>

    </div>

    <div
        class="product food"
    >

        <div class="product-image">
            🍔
        </div>

        <h3>Burger</h3>

        <p>₹199</p>

    </div>

</div>

<script>

function filterProducts(category) {

    const products =
        document.querySelectorAll(
            ".product"
        );

    products.forEach(
        function(product) {

            if (
                category === "all" ||
                product.classList.contains(
                    category
                )
            ) {

                product.style.display =
                    "block";

            }

            else {

                product.style.display =
                    "none";

            }

        }
    );

}

</script>

</body>

</html>
