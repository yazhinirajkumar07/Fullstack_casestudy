<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q4 - Dashboard Tabs</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f5fb;
    font-family:Arial,sans-serif;
    padding:20px;
}

.dashboard{
    width:100%;
    max-width:800px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.1);
}

h1{text-align:center}

.tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:25px 0;
}

.tab{
    flex:1;
    min-width:120px;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#ecebff;
    color:#444;
    font-weight:bold;
}

.tab.active{
    background:#6258dc;
    color:white;
}

.content{
    padding:30px;
    background:#f7f7fb;
    border-radius:15px;
    min-height:200px;
}
</style>
</head>

<body>

<div class="dashboard">

    <h1>Dashboard</h1>

    <div class="tabs">

        <button
            class="tab active"
            onclick="showTab('home',this)"
        >
            Home
        </button>

        <button
            class="tab"
            onclick="showTab('profile',this)"
        >
            Profile
        </button>

        <button
            class="tab"
            onclick="showTab('settings',this)"
        >
            Settings
        </button>

    </div>

    <div
        class="content"
        id="content"
    >
        <h2>Welcome Home</h2>
        <p>
            This is the dashboard home page.
        </p>
    </div>

</div>

<script>

const contents = {

    home:`
        <h2>Welcome Home</h2>
        <p>
            This is the dashboard home page.
        </p>
    `,

    profile:`
        <h2>User Profile</h2>
        <p>
            Your profile information is displayed here.
        </p>
    `,

    settings:`
        <h2>Settings</h2>
        <p>
            Manage your application settings here.
        </p>
    `
};

function showTab(tab,button){

    document
        .getElementById("content")
        .innerHTML =
        contents[tab];

    document
        .querySelectorAll(".tab")
        .forEach(
            item =>
            item.classList.remove("active")
        );

    button.classList.add("active");
}

</script>

</body>
</html>
