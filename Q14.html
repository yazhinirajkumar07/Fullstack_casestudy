<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Q14 - Calculator</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: #f4f5fb;
}

.calculator {

    width: 340px;

    padding: 20px;

    background: #25252d;

    border-radius: 20px;

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.2);
}

#display {

    width: 100%;

    height: 70px;

    margin-bottom: 15px;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: white;

    text-align: right;

    font-size: 28px;
}

.buttons {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}

button {

    height: 55px;

    border: none;

    border-radius: 10px;

    background: #444451;

    color: white;

    font-size: 20px;

    cursor: pointer;
}

button:hover {

    opacity: 0.85;
}

.operator {

    background: #6258dc;
}

.equal {

    background: #22a06b;
}

.clear {

    background: #ef4444;
}

</style>

</head>

<body>

<div class="calculator">

    <input
        type="text"
        id="display"
        readonly
    >

    <div class="buttons">

        <button
            class="clear"
            onclick="clearDisplay()"
        >
            C
        </button>

        <button
            onclick="deleteLast()"
        >
            DEL
        </button>

        <button
            class="operator"
            onclick="appendValue('/')"
        >
            ÷
        </button>

        <button
            class="operator"
            onclick="appendValue('*')"
        >
            ×
        </button>

        <button onclick="appendValue('7')">7</button>

        <button onclick="appendValue('8')">8</button>

        <button onclick="appendValue('9')">9</button>

        <button
            class="operator"
            onclick="appendValue('-')"
        >
            −
        </button>

        <button onclick="appendValue('4')">4</button>

        <button onclick="appendValue('5')">5</button>

        <button onclick="appendValue('6')">6</button>

        <button
            class="operator"
            onclick="appendValue('+')"
        >
            +
        </button>

        <button onclick="appendValue('1')">1</button>

        <button onclick="appendValue('2')">2</button>

        <button onclick="appendValue('3')">3</button>

        <button
            class="equal"
            onclick="calculate()"
        >
            =
        </button>

        <button
            onclick="appendValue('0')"
        >
            0
        </button>

        <button
            onclick="appendValue('.')"
        >
            .
        </button>

    </div>

</div>

<script>

function appendValue(value) {

    document
        .getElementById("display")
        .value += value;

}

function clearDisplay() {

    document
        .getElementById("display")
        .value = "";

}

function deleteLast() {

    const display =
        document
            .getElementById("display");

    display.value =
        display.value.slice(0, -1);

}

function calculate() {

    const display =
        document
            .getElementById("display");

    try {

        display.value =
            eval(display.value);

    }

    catch {

        display.value =
            "Error";

    }

}

</script>

</body>

</html>
