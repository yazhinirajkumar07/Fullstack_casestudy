<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Q20 - Countdown Timer</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #6258dc,
            #8b6df6
        );

    padding: 20px;
}

.container {

    width: 100%;
    max-width: 500px;

    padding: 45px;

    background: white;

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.2);
}

h1 {
    margin-top: 0;
}

#timer {

    font-size:
        clamp(
            70px,
            15vw,
            120px
        );

    font-weight: bold;

    color: #6258dc;

    margin: 30px 0;
}

.controls {

    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;
}

button {

    padding: 13px 25px;

    border: none;

    border-radius: 10px;

    background: #6258dc;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 15px;
}

button:hover {
    opacity: 0.9;
}

.reset {
    background: #ef4444;
}

</style>

</head>

<body>

<div class="container">

    <h1>
        60 Second Timer
    </h1>

    <div id="timer">
        60
    </div>

    <div class="controls">

        <button onclick="startTimer()">
            Start
        </button>

        <button onclick="pauseTimer()">
            Pause
        </button>

        <button
            class="reset"
            onclick="resetTimer()"
        >
            Reset
        </button>

    </div>

</div>

<script>

let time = 60;

let interval = null;


function updateTimer() {

    document
        .getElementById("timer")
        .textContent =
        time;

}


function startTimer() {

    if (interval !== null) {

        return;

    }

    interval =
        setInterval(
            function() {

                time--;

                updateTimer();

                if (time <= 0) {

                    clearInterval(interval);

                    interval = null;

                    alert(
                        "Time is up!"
                    );

                }

            },
            1000
        );

}


function pauseTimer() {

    clearInterval(interval);

    interval = null;

}


function resetTimer() {

    clearInterval(interval);

    interval = null;

    time = 60;

    updateTimer();

}

</script>

</body>

</html>
