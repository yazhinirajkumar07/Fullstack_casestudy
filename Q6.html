<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q6 - Search Filter</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:#f4f5fb;
    padding:20px;
}

.container{
    width:100%;
    max-width:600px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.1);
}

h1{text-align:center}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.item{
    padding:15px;
    margin-top:10px;
    background:#f5f5fa;
    border-radius:10px;
    font-weight:bold;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Search Filter</h1>

<input
    type="text"
    id="search"
    placeholder="Search technologies..."
>

<div id="list">

    <div class="item">HTML</div>
    <div class="item">CSS</div>
    <div class="item">JavaScript</div>
    <div class="item">React</div>
    <div class="item">Python</div>
    <div class="item">Java</div>
    <div class="item">Node JS</div>

</div>

</div>

<script>

document
    .getElementById("search")
    .addEventListener(
        "input",
        function(){

            const value =
                this.value.toLowerCase();

            const items =
                document
                .querySelectorAll(".item");

            items.forEach(
                function(item){

                    const text =
                        item.textContent
                        .toLowerCase();

                    item.classList.toggle(
                        "hidden",
                        !text.includes(value)
                    );
                }
            );
        }
    );

</script>

</body>
</html>
