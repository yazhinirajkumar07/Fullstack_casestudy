<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Q22 - Image Preview</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: #f4f5fb;

    padding: 20px;
}

.container {

    width: 100%;
    max-width: 550px;

    padding: 40px;

    background: white;

    border-radius: 22px;

    text-align: center;

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.1);
}

input {

    width: 100%;

    padding: 15px;

    border: 2px dashed #6258dc;

    border-radius: 12px;

    cursor: pointer;
}

#preview {

    display: none;

    width: 100%;

    max-height: 350px;

    object-fit: cover;

    margin-top: 25px;

    border-radius: 15px;

    box-shadow:
        0 10px 25px
        rgba(0, 0, 0, 0.15);
}

</style>

</head>

<body>

<div class="container">

    <h1>
        Image Upload Preview
    </h1>

    <p>
        Select an image to preview it.
    </p>

    <br>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <img
        id="preview"
        alt="Image Preview"
    >

</div>

<script>

const imageInput =
    document.getElementById(
        "imageInput"
    );

const preview =
    document.getElementById(
        "preview"
    );


imageInput.addEventListener(
    "change",
    function() {

        const file =
            imageInput.files[0];

        if (file) {

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";

        }

    }
);

</script>

</body>

</html>
