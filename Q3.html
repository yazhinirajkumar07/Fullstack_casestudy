<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q3 - Password Strength</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#6258dc,#8b6df6);
    padding:20px;
}
.container{
    width:100%;
    max-width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}
h1{text-align:center;margin-top:0}
input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}
input:focus{border-color:#6258dc}
.bar{
    height:12px;
    background:#e5e7eb;
    border-radius:20px;
    margin-top:20px;
    overflow:hidden;
}
#strengthBar{
    height:100%;
    width:0;
    border-radius:20px;
    transition:.3s;
}
#text{
    text-align:center;
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Password Strength</h1>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
    >

    <div class="bar">
        <div id="strengthBar"></div>
    </div>

    <p id="text">Start typing...</p>
</div>

<script>
const password =
    document.getElementById("password");

const strengthBar =
    document.getElementById("strengthBar");

const text =
    document.getElementById("text");

password.addEventListener(
    "input",
    function(){

        const value = password.value;

        let strength = 0;

        if(value.length >= 6) strength++;

        if(/[A-Z]/.test(value)) strength++;

        if(/[0-9]/.test(value)) strength++;

        if(/[^A-Za-z0-9]/.test(value)) strength++;

        const data = [
            {
                width:"0%",
                color:"#ddd",
                text:"Start typing..."
            },
            {
                width:"25%",
                color:"#ef4444",
                text:"Weak"
            },
            {
                width:"50%",
                color:"#f59e0b",
                text:"Fair"
            },
            {
                width:"75%",
                color:"#3b82f6",
                text:"Good"
            },
            {
                width:"100%",
                color:"#22c55e",
                text:"Strong"
            }
        ];

        strengthBar.style.width =
            data[strength].width;

        strengthBar.style.background =
            data[strength].color;

        text.textContent =
            data[strength].text;
    }
);
</script>

</body>
</html>
